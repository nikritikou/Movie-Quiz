<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Quiz</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #0f0a46;
        color: white;
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
    }

    .container {
        width: 90%;
        max-width: 700px;
        text-align: center;
        padding: 30px 0;
    }

    .screen {
        display: none;
    }

    .screen.active {
        display: block;
    }

    .intro-text {
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        font-size: 18px;
        line-height: 1.7;
        margin-bottom: 35px;
    }

    .like-button {
        background: none;
        border: none;
        color: white;
        font-size: 58px;
        cursor: pointer;
        transition: transform 0.2s ease;
        padding: 0;
    }

    .like-button:hover {
        transform: scale(1.08);
    }

    .like-button.liked {
        color: #ff3040;
        animation: likeAnimation 0.45s ease;
    }

    @keyframes likeAnimation {
        0% {
            transform: scale(1);
        }

        35% {
            transform: scale(1.5);
        }

        65% {
            transform: scale(0.85);
        }

        100% {
            transform: scale(1);
        }
    }

    .question-number {
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        font-size: 15px;
        margin-bottom: 18px;
        opacity: 0.8;
    }

    /* ΜΙΚΡΟΤΕΡΕΣ ΕΡΩΤΗΣΕΙΣ */
    .question {
        font-family: "Arial Black", Arial, Helvetica, sans-serif;
        font-size: 23px;
        line-height: 1.35;
        font-weight: 900;
        margin-bottom: 28px;
    }

    .answers {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    .answer {
        width: 100%;
        padding: 16px 18px;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 10px;
        background: rgba(255,255,255,0.05);
        color: white;
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        font-size: 16px;
        line-height: 1.4;
        cursor: pointer;
        transition:
            background 0.25s ease,
            transform 0.2s ease,
            border-color 0.25s ease;
    }

    .answer:hover {
        background: rgba(255,255,255,0.12);
        border-color: rgba(255,255,255,0.7);
        transform: translateY(-2px);
    }

    .answer.selected {
        background: rgba(255,255,255,0.18);
        border-color: white;
    }

    .result-title {
        font-family: "Arial Black", Arial, Helvetica, sans-serif;
        font-size: 32px;
        font-weight: 900;
        margin-bottom: 20px;
    }

    .result-image {
        width: 100%;
        max-width: 430px;
        border-radius: 12px;
        display: block;
        margin: 0 auto 25px;
    }

    .result-text {
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        font-size: 17px;
        line-height: 1.7;
        margin-bottom: 30px;
    }

    .restart-button {
        background: white;
        color: #0f0a46;
        border: none;
        padding: 13px 28px;
        border-radius: 8px;
        font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s ease;
    }

    .restart-button:hover {
        transform: scale(1.05);
    }

    /* =========================
       BLOOD SPLATTER EFFECT
       ========================= */

    .blood-splatter {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
    }

    .blood-drop {
        position: absolute;
        width: 10px;
        height: 10px;
        background: #b30000;
        border-radius: 50%;
        opacity: 0;
        animation: bloodDrop 0.65s ease-out forwards;
    }

    .blood-drop:nth-child(1) {
        width: 18px;
        height: 18px;
        --x: -95px;
        --y: -70px;
    }

    .blood-drop:nth-child(2) {
        width: 9px;
        height: 9px;
        --x: 100px;
        --y: -80px;
    }

    .blood-drop:nth-child(3) {
        width: 14px;
        height: 14px;
        --x: 75px;
        --y: 65px;
    }

    .blood-drop:nth-child(4) {
        width: 7px;
        height: 7px;
        --x: -105px;
        --y: 55px;
    }

    .blood-drop:nth-child(5) {
        width: 11px;
        height: 11px;
        --x: 125px;
        --y: 5px;
    }

    .blood-drop:nth-child(6) {
        width: 6px;
        height: 6px;
        --x: -130px;
        --y: -15px;
    }

    .blood-drop:nth-child(7) {
        width: 5px;
        height: 5px;
        --x: 40px;
        --y: -120px;
    }

    .blood-drop:nth-child(8) {
        width: 8px;
        height: 8px;
        --x: -45px;
        --y: 110px;
    }

    .blood-drop:nth-child(9) {
        width: 4px;
        height: 4px;
        --x: 150px;
        --y: -45px;
    }

    .blood-drop:nth-child(10) {
        width: 5px;
        height: 5px;
        --x: -150px;
        --y: 30px;
    }

    @keyframes bloodDrop {
        0% {
            opacity: 0;
            transform: translate(0, 0) scale(0.2);
        }

        15% {
            opacity: 1;
        }

        100% {
            opacity: 0.9;
            transform: translate(var(--x), var(--y)) scale(1);
        }
    }

    .blood-center {
        position: absolute;
        width: 42px;
        height: 42px;
        background: #a80000;
        border-radius: 50% 45% 55% 40%;
        opacity: 0;
        animation: bloodCenter 0.5s ease-out forwards;
    }

    @keyframes bloodCenter {
        0% {
            opacity: 0;
            transform: scale(0.2);
        }

        20% {
            opacity: 1;
            transform: scale(1.5);
        }

        100% {
            opacity: 0;
            transform: scale(2.2);
        }
    }

    @media (max-width: 600px) {
        .container {
            width: 88%;
        }

        .intro-text {
            font-size: 16px;
        }

        .question {
            font-size: 20px;
            line-height: 1.35;
        }

        .answer {
            font-size: 15px;
            padding: 14px 15px;
        }

        .result-title {
            font-size: 27px;
        }

        .result-text {
            font-size: 16px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <div id="introScreen" class="screen active">

        <div class="intro-text">
            Δεν θα πρωτοτυπήσω, καθώς όπως και εσύ, είμαι άνθρωπος της συνήθειας.

let currentQuestion = 0;

let scores = {
    wolfman: 0,
    timeCut: 0,
    silence: 0,
    rite: 0
};


function startQuiz() {

    const button =
        document.getElementById("likeButton");

    button.classList.add("liked");
    button.innerHTML = "♥";

    setTimeout(() => {

        document.getElementById("introScreen")
            .classList.remove("active");

        document.getElementById("quizScreen")
            .classList.add("active");

        showQuestion();

    }, 500);
}


function showQuestion() {

    const questionData =
        questions[currentQuestion];

    document.getElementById("questionNumber")
        .textContent =
        `Ερώτηση ${currentQuestion + 1} / ${questions.length}`;

    document.getElementById("question")
        .textContent =
        questionData.question;

    const answersContainer =
        document.getElementById("answers");

    answersContainer.innerHTML = "";


    const shuffledAnswers =
        [...questionData.answers]
        .sort(() => Math.random() - 0.5);


    shuffledAnswers.forEach(answer => {

        const button =
            document.createElement("button");

        button.className = "answer";
        button.textContent = answer.text;


        button.addEventListener("click", () => {

            createBloodEffect();

            button.classList.add("selected");

            scores[answer.movie]++;


            setTimeout(() => {

                currentQuestion++;

                if (currentQuestion < questions.length) {

                    showQuestion();

                } else {

                    showResult();

                }

            }, 550);

        });


        answersContainer.appendChild(button);

    });
}


function createBloodEffect() {

    const splatter =
        document.createElement("div");

    splatter.className =
        "blood-splatter";


    const center =
        document.createElement("div");

    center.className =
        "blood-center";

    splatter.appendChild(center);


    for (let i = 0; i < 10; i++) {

        const drop =
            document.createElement("div");

        drop.className =
            "blood-drop";

        splatter.appendChild(drop);

    }


    document.body.appendChild(splatter);


    setTimeout(() => {

        splatter.remove();

    }, 800);
}


function showResult() {

    let winner = "wolfman";
    let highestScore = scores.wolfman;


    Object.keys(scores).forEach(movie => {

        if (scores[movie] > highestScore) {

            highestScore = scores[movie];
            winner = movie;

        }

    });


    const result =
        movies[winner];


    document.getElementById("quizScreen")
        .classList.remove("active");

    document.getElementById("resultScreen")
        .classList.add("active");


    document.getElementById("resultTitle")
        .textContent =
        result.title;

    document.getElementById("resultImage")
        .src =
        result.image;

    document.getElementById("resultText")
        .textContent =
        result.text;


    sendResultToGoogleSheet(result.title);
}


function sendResultToGoogleSheet(result) {

    fetch(GOOGLE_SCRIPT_URL, {

        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type":
            "text/plain;charset=utf-8"
        },

        body: JSON.stringify({
            result: result
        })

    }).catch(error => {

        console.error(
            "Δεν ήταν δυνατή η αποστολή του αποτελέσματος.",
            error
        );

    });
}


function restartQuiz() {

    currentQuestion = 0;

    scores = {
        wolfman: 0,
        timeCut: 0,
        silence: 0,
        rite: 0
    };


    document.getElementById("resultScreen")
        .classList.remove("active");

    document.getElementById("introScreen")
        .classList.add("active");


    const button =
        document.getElementById("likeButton");

    button.classList.remove("liked");

    button.innerHTML = "♡";
}
